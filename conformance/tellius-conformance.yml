domain_standard:
  market: analytics and business intelligence
  declared: false
  note: 'REWARD-ONLY, and nothing is claimed here. The analytics/BI market has no
    single contract-declared interchange standard of the kind SCIM, OData, OpenRTB,
    HL7v2 or OAI-PMH provide in their sectors, and Tellius declares none in any
    contract. Tellius does integrate with vertical data providers (IQVIA, Symphony
    Health, Veeva CRM, MMIT, NielsenIQ, Circana) and reads Snowflake Semantic Views,
    but these are vendor integrations, not a declared domain standard, so no
    conformance is asserted. The nearest thing to a domain standard Tellius DOES
    declare is MCP itself, recorded above.'
  candidates_probed:
  - id: odata
    found: false
    note: 'No $metadata surface; no OData query grammar in the documented endpoints.'
  - id: xmla
    found: false
    note: 'No XMLA/MDX endpoint documented, despite the BI category.'
  - id: dcat
    found: false
    note: 'No data catalog vocabulary exposed.'
