apis:
- aid: tellius:tellius-platform-api
  name: Tellius Platform API
  description: 'The Tellius backend REST and WebSocket API. Authenticate against
    /api/auth/login for a JWT (or a cookie session), then call the Insights APIs
    (list, delete, notifications), the Search APIs (a WebSocket channel carrying
    history, suggestion, validation and query-execution messages correlated by
    corrId), and the ML Model APIs (OAuth2 client_credentials, JSON and file
    prediction submission, paginated and CSV result retrieval). Tellius is deployed
    per customer, so the base host is the customer''s own Tellius domain.'
  humanURL: https://help.tellius.com/api
  baseURL: https://{tellius-deployment-host}
  tags:
  - Analytics
  - Insights
  - Search
  - Machine Learning
  properties:
  - type: Documentation
    url: https://help.tellius.com/api
  - type: APIReference
    url: https://help.tellius.com/api
  - type: Authentication
    url: authentication/tellius-authentication.yml
  - type: ErrorCatalog
    url: errors/tellius-problem-types.yml
- aid: tellius:tellius-mcp-server
  name: Tellius MCP Server
  description: 'Tellius exposes its analytics engine through a hosted MCP server
    that runs inside each Tellius deployment. It speaks MCP over streamable HTTP
    (SSE available for older clients) and publishes 25 tools, 6 resources and 3
    prompts, including tellius_ask (natural-language question to governed SQL and
    results), tellius_deep_insight (multi-step agentic root cause investigation),
    and headless workflow, schedule and memory management. Access is OAuth: the
    endpoint answers unauthenticated calls with an RFC 9728 WWW-Authenticate
    challenge pointing at /.well-known/oauth-protected-resource.'
  humanURL: https://help.tellius.com/kaiya/tellius-mcp-server
  baseURL: https://{tellius-deployment-host}/mcp
  tags:
  - Model Context Protocol
  - Agentic Analytics
  - Artificial Intelligence
  properties:
  - type: MCPServer
    url: mcp/tellius-mcp.yml
  - type: Documentation
    url: https://help.tellius.com/kaiya/tellius-mcp-server
  - type: OAuthScopes
    url: scopes/tellius-scopes.yml
