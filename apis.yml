aid: tellius
name: Tellius
description: 'Tellius is an agentic analytics platform that deploys AI agents ("Kaiya")
  on governed enterprise data to automate root cause analysis, variance decomposition
  and insight delivery across structured and unstructured sources. It sits above the
  data warehouse (Snowflake, Databricks, BigQuery, Redshift) without moving data, and
  exposes its analytics engine to developers three ways: a REST + WebSocket platform
  API (login/JWT, Search, Insights and ML prediction endpoints), an iFrame + postMessage
  embedding surface for Vizpads, Search, Kaiya and Feeds, and a hosted MCP server that
  any MCP client can call over streamable HTTP with OAuth. Because Tellius ships as a
  per-customer Kubernetes deployment, every API base URL and MCP endpoint is tenant-specific
  rather than a single shared public host. Founded by Ajay Khanna; SOC 2 Type II certified;
  5x Gartner Magic Quadrant Visionary for Analytics and BI Platforms (2022-2026).'
