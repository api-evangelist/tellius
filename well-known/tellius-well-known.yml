generated: '2026-08-30'
method: probed
source: 'Direct HTTP probes of /.well-known/* on every Tellius host known from apis.yml
  and from the Tellius API documentation, 2026-08-30.'
name: Tellius well-known documents
note: 'Tellius ships as a per-customer Kubernetes deployment, so there is no single
  shared production API host to probe. The marketing host (www.tellius.com) and the
  GitBook docs host (help.tellius.com) serve nothing under /.well-known/. A Tellius
  DEPLOYMENT host does: qa1.dev.tellius.com — the host Tellius itself uses in the
  curl examples on its own Authentication API page — serves a real RFC 8414 OAuth
  authorization server metadata document and a real RFC 9728 protected resource
  metadata document, both anonymously. That host is a Tellius-operated QA deployment,
  not a customer production base; it is recorded here because it is the only publicly
  reachable instance of the well-known surface every Tellius deployment serves, and
  because Tellius published its hostname in its own public documentation.'
