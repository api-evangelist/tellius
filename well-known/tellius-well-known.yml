  documents:
  - path: /.well-known/oauth-authorization-server
    status: 200
    file: well-known/tellius-oauth-authorization-server.json
    content_type: application/json; charset=utf-8
    summary: 'RFC 8414 authorization server metadata. issuer https://qa1.dev.tellius.com;
      token, authorization and dynamic client registration endpoints under /oauth/;
      grant types client_credentials, authorization_code, refresh_token; PKCE S256;
      token endpoint auth methods none and client_secret_post; scopes_supported: [mcp].'
  - path: /.well-known/oauth-protected-resource
    status: 200
