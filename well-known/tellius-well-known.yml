findings:
- 'No security.txt (RFC 9116) is published on any Tellius host.'
- 'No /.well-known/api-catalog (RFC 9727) is published.'
- 'No A2A agent card is published at either the current or the legacy well-known path.'
- 'The two documents that ARE served are the pair an MCP client needs to complete an
  OAuth flow against a Tellius deployment, and they are served anonymously — the MCP
  endpoint itself is gated.'
