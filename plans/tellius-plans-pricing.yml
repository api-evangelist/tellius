findings:
- 'Prices are contact-sales only, but the QUOTAS are published per tier, which is
  more than most enterprise analytics vendors disclose. Those quotas are the real
  limits an API integrator hits: 5 concurrent AutoML jobs on Premium bounds how many
  ML prediction pipelines can run at once, and the 50M-row live-mode ceiling bounds
  what a tellius_ask question can scan.'
- No self-serve purchase path and no published per-seat or per-call rate.
