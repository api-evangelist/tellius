- version: 6.3.1
  url: https://help.tellius.com/whats-new/release-6.3/patch-6.3.1
  type: patch
  breaking: []
  additions:
  - 'Security Tags become the platform-wide mechanism for row-level permissions,
    defined once and applied wherever a user asks — Kaiya conversation, Mission or App.'
  - 'Kaiya Apps gain live querying behind interactive filters and an Analysis tab that
    traces how an App was produced.'
  - 'Vizpad Selective Export, gradient conditional formatting, and export consistency
    across PDF, PowerPoint, Excel and CSV.'
  - 'Key-pair authentication for Snowflake; duplicate datasource consolidation;
    session management under Settings.'
- version: 6.3
  url: https://help.tellius.com/whats-new/release-6.3
  type: minor
  breaking: []
  highlights:
  - 'Tellius MCP server — the analytics engine exposed to any MCP client over
    streamable HTTP. This is the release that made Tellius agent-callable.'
  - 'Kaiya browser extension: a side panel on any web page, including Power BI and
    Tableau dashboards.'
  - 'Slack and Teams integration — mention @Kaiya in a channel, trigger Missions with
    slash commands.'
  - 'Skills: a layer letting admins tune how Kaiya writes, charts and reasons for a
    given user base without editing system prompts.'
  - 'Build Kaiya Missions conversationally (Kaiya Architect) — describe the workflow,
    Kaiya drafts editable steps and executes from the same thread.'
  - 'Redesigned homepage surfacing scheduled Mission outputs and recent context;
    new-user onboarding from fresh login to live conversation in about ten minutes.'
- version: 6.2
  url: https://help.tellius.com/whats-new/release-6.2
  type: minor
  breaking: []
  highlights:
  - 'Kaiya Apps — turn a completed analysis into an interactive, role-specific
    application.'
  - 'Data Architect — raw tables to a production-ready Business View from within the
    conversation.'
  - 'Persistent memory: definitions, corrections and preferences stay learned across
    sessions and users.'
  - 'A single conversation can span multiple Business Views, carrying filters, context
    and history forward.'
- version: 6.1
  url: https://help.tellius.com/whats-new/release-6.1
  type: minor
  breaking: []
  highlights:
  - 'Kaiya grounds internal analytics with external anchor details (event dates,
