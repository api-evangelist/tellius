  - 'Voice Mode with natural multi-turn conversation.'
  - 'Improved short-term memory across Deep Insights and standard analytics;
    auto-routing selects the execution path without manual mode switching.'
  - 'Export text, charts, tables; conversations to Word; Vizpads to Excel/CSV with
    filter provenance.'
- version: 6.0
