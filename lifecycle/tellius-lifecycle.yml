name: Tellius lifecycle
note: 'Tellius ships as a versioned, customer-deployed platform rather than a
  continuously deployed multi-tenant service, so its lifecycle is a product-release
  lifecycle. The API surface is unversioned and rides the platform version.'

versioning:
  api_versioning: none
  api_versioning_evidence: 'No version segment, header or media-type version on any
    documented endpoint: /api/auth/login, /insight, /api/jobs/list,
    /proxy/ml/external/predict, /oauth/token, /mcp.'
  product_versioning:
    scheme: 'MAJOR.MINOR with dotted patch levels'
    current_version: 6.3.2
    examples:
    - '6.3, 6.3.0.1, 6.3.0.2, 6.3.1, 6.3.2'
    - '6.2, 6.2.0.1 through 6.2.0.6'
    - '6.1, 6.1.0.1 through 6.1.0.6'
  documentation_versioning:
    versioned: true
    current: '6.3'
    retained:
    - '6.3'
    - '6.2'
    - '6.1'
    - '6.0'
    - '5.6'
    - '5.5'
    - '5.4'
    note: 'help.tellius.com keeps a full documentation tree per retained release
      (e.g. /tellius-6.2/..., /tellius-6.1/...). Older release notes back to 4.2 are
      still reachable within the What''s New tree. This is the strongest lifecycle
      signal Tellius publishes: a customer on 6.0 can still read 6.0 documentation.'
    source: https://help.tellius.com/llms.txt

release_notes:
