generated: '2026-08-30'
method: derived
source: 'mcp/tellius-mcp.yml + the Tellius REST reference at https://help.tellius.com/api
  (Authentication, Insights, Search and ML Model API pages)'
name: Tellius MCP tool to REST operation crosswalk
note: 'Tellius publishes NO OpenAPI definition, so there are no operationIds to bind
  to. The rest[] rows below therefore carry documented HTTP method + path strings
  taken verbatim from the Tellius API reference, and every binding confidence is set
  accordingly. Because the MCP tools/list endpoint is OAuth-gated (probed 401 with an
  RFC 9728 challenge on 2026-08-30), tool input schemas were also unavailable, so
  bindings are by name and documented semantics only. The dominant finding is the
  divergence itself: the MCP surface and the REST surface are near-disjoint
  projections of the Tellius platform — the MCP server is built over Kaiya and
  Business Views, while the documented REST API is built over Insights, Search and ML
  models, and almost nothing overlaps.'

surfaces:
  openapi: null
  openapi_note: 'No OpenAPI/Swagger definition found. Probed /openapi.json,
    /swagger.json, /api-docs and /v3/api-docs on www.tellius.com, help.tellius.com and
    the deployment hosts named in Tellius'' own docs; the marketing and docs hosts 404
    and the deployment hosts answer 401 on every path. The REST reference is prose in
    GitBook.'
  graphql: null
  mcp:
    url: https://{tellius-deployment-host}/mcp
    gated: true
    gate: 'OAuth 2.1 / RFC 9728. tools/list returns 401 invalid_token with
      WWW-Authenticate: Bearer resource_metadata=...'
  rest:
    base: https://{tellius-deployment-host}
    docs: https://help.tellius.com/api
    gated: true
    gate: 'JWT from POST /api/auth/login, or OAuth2 client_credentials for the ML
      endpoints.'
  websocket:
    docs: https://help.tellius.com/api/search-apis
    note: 'The Search surface is a WebSocket channel, not REST. Requests and responses
      are correlated by a caller-generated corrId.'

crosswalk:
- tool: tellius_ask
  category: ask-and-analyze
  rest:
  - 'WS search: {nlpQuery, businessViewId, performQuery:true, enterKeyPress:true, createViz:true, corrId}'
  binding: semantic
  confidence: medium
  note: 'Both take a natural-language question plus a Business View id and return an
    answer with a visualization/data. The REST-side equivalent is the Search WebSocket
    "Execute a query" message, not an HTTP operation. tellius_ask additionally returns
    the generated SQL when include_raw is true; the documented WebSocket response does
    not show a SQL field.'
- tool: tellius_get_starter_questions
  category: ask-and-analyze
  rest:
  - 'WS search: {getNlpSuggestionsFor, businessViewId, corrId} (View suggestions)'
  binding: semantic
  confidence: low
  note: 'Adjacent, not equivalent: suggestions complete a partially typed token,
    starter questions propose whole questions for a Business View.'

