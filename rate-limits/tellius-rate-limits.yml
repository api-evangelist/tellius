soft_guidance:
- guidance: 'Avoid firing many deep insights at once. Long-running calls hold resources
    for their whole duration. Queue them rather than launching a large batch in
    parallel, or fast queries issued at the same time may be left waiting.'
  applies_to: tellius_deep_insight (MCP)
  source: https://help.tellius.com/kaiya/tellius-mcp-server
  note: 'This is the only concurrency guidance Tellius gives an agent, and it is prose
    advice with no enforced number attached.'
- guidance: 'Set a generous client timeout — a timeout tuned for a simple query will
    cut off a deep insight before it finishes.'
  applies_to: tellius_deep_insight (MCP)
  source: https://help.tellius.com/kaiya/tellius-mcp-server

findings:
- 'An agent calling Tellius cannot discover its budget: there is no documented limit,
  no header, and no 429 contract. Because Tellius is customer-deployed, effective
  limits are whatever the customer''s cluster and tier capacity allow — but that is
  inferred, not stated.'
