          description: Success (status as documented)
      x-evidence:
        kind: code-example
        language: curl
        snippet: "curl -X PUT \\ https://dev.app.tellius.com/insight/insightID  -H\
          \ 'authorization: <your_token_here>'  -H 'cache-control: no-cache'  -H 'content-type:\
          \ application/json'  -H 'postman-token: b97aaee9-ac75-369e-2d75-026e4a7ef624'\
          \  -d '{ \n\"consumed\": true\n}'\n```"
